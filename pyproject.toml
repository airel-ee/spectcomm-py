[project]
name = "spectcomm-py"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sander Mirme", email = "sander@airel.ee" }
]
requires-python = ">=3.10"
dependencies = [
    "cbor2>=6.1.3",
    "cobs>=1.2.1",
    "pyserial>=3.5",
    "pyusb>=1.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airel"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

